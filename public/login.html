<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Traceur</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#10140F">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Traceur">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/pwa.js" defer></script>
<style>
  html, body { height: 100%; margin: 0; padding: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1e5631 0%, #2f7a4d 40%, #a3c96b 100%);
    font-family: 'Segoe UI', Verdana, Arial, sans-serif;
  }
  .container {
    text-align: center; padding: 2.5rem 3rem;
    background: rgba(255, 255, 255, 0.12); border-radius: 20px;
    backdrop-filter: blur(6px); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
    max-width: 420px;
  }
  .icon { margin-bottom: 0.5rem; }
  .icon img { width: 72px; height: 72px; border-radius: 16px; box-shadow: 0 6px 18px rgba(0,0,0,.3); }
  h1 { color: #ffffff; font-size: 1.9rem; font-weight: 600; margin: 0 0 0.5rem 0; text-shadow: 0 2px 10px rgba(0,0,0,.3); }
  p { color: #eafbe7; font-size: 1.05rem; margin-top: 0.4rem; opacity: 0.9; }
  .buttons { display: flex; flex-direction: column; gap: 0.8rem; margin-top: 1.8rem; }
  button.social {
    display: flex; align-items: center; justify-content: center; gap: 0.7rem;
    padding: 0.75rem 1.2rem; border-radius: 10px; border: none;
    font-size: 1rem; font-weight: 600; cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  button.social:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0,0,0,0.2); }
  .google { background: #fff; color: #3c4043; }
  .facebook { background: #1877f2; color: #fff; }
  .cta {
    margin-top: 1.8rem; padding: 0.75rem 1.6rem; border-radius: 10px; border: none;
    background: #ffffff; color: #1e5631; font-size: 1rem; font-weight: 700; cursor: pointer;
  }
  .hidden { display: none; }
  .loading { color: #eafbe7; }
  .error { color: #ffd7d7; font-size: .85rem; margin-top: 1rem; }
  .success { color: #d7ffe0; font-size: .85rem; margin-top: 1rem; }
  .divider { display: flex; align-items: center; gap: .7rem; margin: 1.4rem 0; color: #eafbe7; opacity: .7; font-size: .8rem; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,.3); }
  .magic-form { display: flex; flex-direction: column; gap: .6rem; }
  .magic-form input[type="email"] {
    padding: .7rem .9rem; border-radius: 10px; border: none; font-size: .95rem;
    background: rgba(255,255,255,.92); color: #1e5631;
  }
  .magic-form button {
    padding: .7rem 1rem; border-radius: 10px; border: none; cursor: pointer;
    background: #eafbe7; color: #1e5631; font-weight: 700; font-size: .95rem;
  }
  .magic-form button:disabled { opacity: .6; cursor: not-allowed; }
</style>
</head>
<body>
  <div class="container">
    <div class="icon"><img src="/icons/icon-512.png" alt="Traceur"></div>
    <div id="loading" class="loading">Chargement…</div>

    <div id="login-view" class="hidden">
      <h1>Bienvenue sur Traceur</h1>
      <p>Connectez-vous pour accéder à l'application</p>
      <div class="buttons">
        <button class="social google" id="google-btn"><span>🔵</span> Continuer avec Google</button>
        <button class="social facebook" id="facebook-btn"><span>📘</span> Continuer avec Facebook</button>
      </div>

      <div class="divider">ou</div>

      <form class="magic-form" id="magic-form">
        <input type="email" id="magic-email" placeholder="ton@email.com" required autocomplete="email">
        <button type="submit" id="magic-submit">✉️ Recevoir un lien de connexion</button>
      </form>

      <div id="error" class="error hidden"></div>
      <div id="success" class="success hidden"></div>
    </div>

  </div>

<script>
  // Ces deux valeurs sont publiques par nature (clé "anon", protégée par
  // les policies RLS côté base) : c'est normal qu'elles soient dans le JS
  // servi au navigateur. Ce qui ne doit JAMAIS s'y trouver, c'est la clé
  // service_role (voir lib/supabaseAdmin.js, utilisé uniquement côté serveur).
  const SUPABASE_URL = window.__SUPABASE_CONFIG__.url;
  const SUPABASE_ANON_KEY = window.__SUPABASE_CONFIG__.anonKey;

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const loadingEl = document.getElementById('loading');
  const loginView = document.getElementById('login-view');
  const errorEl = document.getElementById('error');

  function showLogin() {
    loadingEl.classList.add('hidden');
    loginView.classList.remove('hidden');
  }

  // Synchronise la session supabase-js (côté client) avec un cookie
  // httpOnly côté serveur, seul élément que nos routes protégées vérifient.
  // Ne redirige vers /app qu'une fois cette synchro confirmée : sinon le
  // middleware serveur renverrait immédiatement l'utilisateur ici.
  async function syncServerSession(session) {
    if (!session) return false;
    try {
      const res = await fetch('/auth/session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ access_token: session.access_token }),
      });
      return res.ok;
    } catch {
      return false;
    }
  }

  async function goToApp(session) {
    const ok = await syncServerSession(session);
    if (ok) {
      window.location.href = '/app';
    } else {
      errorEl.textContent = "Impossible d'établir la session. Réessaie.";
      errorEl.classList.remove('hidden');
      showLogin();
    }
  }

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      goToApp(session);
    } else {
      showLogin();
    }
  }

  sb.auth.onAuthStateChange(async (event, session) => {
    if (session) {
      goToApp(session);
    } else {
      await fetch('/auth/logout', { method: 'POST' }).catch(() => {});
      showLogin();
    }
  });

  document.getElementById('google-btn').addEventListener('click', () => {
    sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + '/login.html' } });
  });

  document.getElementById('facebook-btn').addEventListener('click', () => {
    sb.auth.signInWithOAuth({ provider: 'facebook', options: { redirectTo: window.location.origin + '/login.html' } });
  });

  const successEl = document.getElementById('success');
  const magicForm = document.getElementById('magic-form');
  const magicSubmit = document.getElementById('magic-submit');

  magicForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('magic-email').value.trim();
    if (!email) return;

    errorEl.classList.add('hidden');
    successEl.classList.add('hidden');
    magicSubmit.disabled = true;
    magicSubmit.textContent = 'Envoi en cours…';

    // Même mécanisme que Google/Facebook : Supabase renvoie sur cette
    // même page (login.html) une fois le lien cliqué, onAuthStateChange
    // ci-dessus prend le relais (sync du cookie + redirection vers /app).
    const { error } = await sb.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: window.location.origin + '/login.html' },
    });

    magicSubmit.disabled = false;
    magicSubmit.textContent = '✉️ Recevoir un lien de connexion';

    if (error) {
      errorEl.textContent = error.message;
      errorEl.classList.remove('hidden');
      return;
    }
    successEl.textContent = `Lien de connexion envoyé à ${email} — vérifie ta boîte mail (et les spams).`;
    successEl.classList.remove('hidden');
    magicForm.reset();
  });

  init();
</script>
</body>
</html>
