<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rando</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e5631 0%, #2f7a4d 40%, #a3c96b 100%);
    font-family: 'Segoe UI', Verdana, Arial, sans-serif;
  }
  .container {
    text-align: center;
    padding: 2.5rem 3rem;
    background: rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    backdrop-filter: blur(6px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
    max-width: 420px;
  }
  .icon { font-size: 3rem; margin-bottom: 0.5rem; }
  h1 {
    color: #ffffff;
    font-size: 1.9rem;
    font-weight: 600;
    margin: 0 0 0.5rem 0;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
  }
  p { color: #eafbe7; font-size: 1.05rem; margin-top: 0.4rem; opacity: 0.9; }
  .buttons {
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
    margin-top: 1.8rem;
  }
  button.social {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.7rem;
    padding: 0.75rem 1.2rem;
    border-radius: 10px;
    border: none;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  button.social:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0,0,0,0.2); }
  .google { background: #fff; color: #3c4043; }
  .facebook { background: #1877f2; color: #fff; }
  .cta {
    margin-top: 1.8rem;
    padding: 0.75rem 1.6rem;
    border-radius: 10px;
    border: none;
    background: #ffffff;
    color: #1e5631;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
  .cta:hover { transform: translateY(-2px); }
  .hidden { display: none; }
  .loading { color: #eafbe7; }
</style>
</head>
<body>
  <div class="container">
    <div class="icon">🥾</div>

    <div id="loading" class="loading">Chargement…</div>

    <div id="login-view" class="hidden">
      <h1>Bienvenue sur Rando</h1>
      <p>Connectez-vous pour accéder à l'application</p>
      <div class="buttons">
        <button class="social google" id="google-btn">
          <span>🔵</span> Continuer avec Google
        </button>
        <button class="social facebook" id="facebook-btn">
          <span>📘</span> Continuer avec Facebook
        </button>
      </div>
    </div>

    <div id="welcome-view" class="hidden">
      <h1 id="welcome-title">Bienvenue !</h1>
      <p>Nous allons pouvoir maintenant commencer.</p>
      <button class="cta" id="start-btn">Commencer</button>
    </div>
  </div>

<script>
  const SUPABASE_URL = "https://gsvazsseceadhpexfqbo.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdzdmF6c3NlY2VhZGhwZXhmcWJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2MzUxODcsImV4cCI6MjEwMDIxMTE4N30.ZCn0wB2JcP2sYkuWnVaghBQtHV12G39yAsQF72En1i8";

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const loadingEl = document.getElementById('loading');
  const loginView = document.getElementById('login-view');
  const welcomeView = document.getElementById('welcome-view');
  const welcomeTitle = document.getElementById('welcome-title');

  function firstNameFromUser(user) {
    const meta = user.user_metadata || {};
    const full = meta.full_name || meta.name || user.email || 'là';
    return full.split(' ')[0];
  }

  function showLogin() {
    loadingEl.classList.add('hidden');
    welcomeView.classList.add('hidden');
    loginView.classList.remove('hidden');
  }

  function showWelcome(user) {
    loadingEl.classList.add('hidden');
    loginView.classList.add('hidden');
    welcomeTitle.textContent = `Bienvenue ${firstNameFromUser(user)}`;
    welcomeView.classList.remove('hidden');
  }

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      showWelcome(session.user);
    } else {
      showLogin();
    }
  }

  sb.auth.onAuthStateChange((_event, session) => {
    if (session) {
      showWelcome(session.user);
    } else {
      showLogin();
    }
  });

  document.getElementById('google-btn').addEventListener('click', () => {
    sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin }
    });
  });

  document.getElementById('facebook-btn').addEventListener('click', () => {
    sb.auth.signInWithOAuth({
      provider: 'facebook',
      options: { redirectTo: window.location.origin }
    });
  });

  document.getElementById('start-btn').addEventListener('click', () => {
    window.location.href = '/users';
  });

  init();
</script>
</body>
</html>
